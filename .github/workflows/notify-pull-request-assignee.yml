name: Notify Pull Request Assignee

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - assigned

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  notify-assignee:
    runs-on: ubuntu-latest

    steps:
      - name: Notify assignee
        uses: actions/github-script@v7
        with:
          script: |
            const assignees = context.payload.pull_request.assignees || [];

            if (assignees.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ This Pull Request has no assignee. Please assign it to the colleague responsible for the review.'
              });
              return;
            }

            const mentions = assignees
              .map(assignee => `@${assignee.login}`)
              .join(', ');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔔 ${mentions} — this Pull Request has been assigned to you. Please review the changes when possible.`
            });